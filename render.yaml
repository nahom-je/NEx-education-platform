services:
  - type: web
    name: nex-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: COURSE_PRICE
        value: 70
      - key: ADMIN_TELEGRAM
        value: "@nahomJT"
      - key: FRONTEND_URL
        sync: false
